[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymagbot"
version = "0.1.0"
description = "Modeling and control of magnetic microrobots"
authors = [
    {name = "David FOLIO", email = "david.folio@insa-cvl.fr"}
]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "mkdocs",
    "mkdocstrings[python]"
]