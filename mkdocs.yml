site_name: PyMagBot
site_description: "PyMagBot is a Python module for modeling and control of magnetic microrobots."
site_url: https://dfolio.fr
repo_url: https://github.com/dfolio/pymagbot
repo_name: dfolio/pymagbot
copyright: Copyright &copy; 2025 <a href="https://dfolio.fr">David Folio</a>
site_author: David Folio
docs_dir: docs
watch: [mkdocs.yml, README.md, pymagbot/, pymagbot/math/] #, CHANGELOG.md

theme:
  name: material
#  locale: en
  features:
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - search.highlight
  - search.suggest
  - toc.follow

nav:
  - Home:
    - Overview: index.md
    - License: license.md
  - Usage:
      - usage/index.md
      - usage/spatial.md
      - usage/frame.md
  - API Reference:
      - Math:
        - math/index.md
        - Spatial: math/spatial.md
        - Frames: math/frame.md
        - Geometry:  math/geometry.md
      #- Utils: utils.md
  - Author's website: https://dfolio.fr/

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          load_external_modules: true
          inventories:
            - url: https://docs.python-requests.org/en/master/objects.inv
              domains: [std, py]
            - https://docs.python.org/3/objects.inv
            - https://installer.readthedocs.io/en/stable/objects.inv  # demonstration purpose in the docs
            - https://mkdocstrings.github.io/autorefs/objects.inv
            - https://www.mkdocs.org/objects.inv
            - https://python-markdown.github.io/objects.inv
            - https://pytorch.org/docs/stable/objects.inv
            - https://numpy.org/doc/1.26/objects.inv
            - https://plotly.com/python-api-reference/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
          options:
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            #heading_level: 1
            inherited_members: true
            merge_init_into_class: true
            members_order: "source"
            parameter_headings: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

#  - git-revision-date-localized:
#      enabled: !ENV [DEPLOY, false]
#      enable_creation_date: true
#      type: timeago
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/dfolio

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - smarty
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js
